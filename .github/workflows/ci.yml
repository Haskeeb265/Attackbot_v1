name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.4.4
      - name: Run ruff
        run: ruff check backend/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Run mypy
        run: mypy backend/shared/ --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attackbot
          POSTGRES_PASSWORD: attackbot
          POSTGRES_DB: attackbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U attackbot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://attackbot:attackbot@localhost:5432/attackbot
        run: pytest tests/ --cov=backend/shared --cov-report=xml -v
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: |
          for svc in scraper core_engine reporter attack_graph_engine api_gateway; do
            echo "Building $svc..."
            docker build \
              -f backend/services/${svc}/Dockerfile \
              -t attackbot-${svc} \
              .
          done