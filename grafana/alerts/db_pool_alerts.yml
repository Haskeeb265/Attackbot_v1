groups:
  - name: db_pool_alerts
    interval: 30s
    rules:
      - alert: ConnectionPoolHighUsage
        expr: db_pool_checked_out / db_pool_size > 0.8
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database connection pool usage high"
          description: "Pool usage above 80% for 5 minutes"

      - alert: ConnectionPoolExhausted
        expr: db_pool_overflow > 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool exhausted"
          description: "Overflow connections detected"

      - alert: ConnectionPoolLongWait
        expr: histogram_quantile(0.99, rate(db_pool_wait_time_seconds_bucket[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database pool wait time high"
          description: "p99 wait time > 100ms for 5 minutes"

